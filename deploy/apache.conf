Listen 8443
ServerName localhost
ServerTokens Prod
ServerSignature Off
LimitRequestBody 65536
<Directory /app/web>
    Require all granted
    Options -Indexes
    AllowOverride None
</Directory>
<VirtualHost *:80>
    DocumentRoot /app/web
    RewriteEngine On
    RewriteRule ^/api/ - [R=403,L]
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
</VirtualHost>
<VirtualHost *:8443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /run/tls/server.crt
    SSLCertificateKeyFile /run/tls/server.key
    DocumentRoot /app/web
    Alias /api/ /app/backend/public/index.php/
    Alias /internal/ /app/backend/public/index.php/internal/
    <Directory /app/backend/public>
        Require all granted
        AcceptPathInfo On
    </Directory>
    <Directory /app/web>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    Header always set Cache-Control no-store
</VirtualHost>
