name: sismoalert
services:
  db:
    image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
    env_file: .local/runtime.env
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .local/runtime.env
    environment:
      DB_HOST: db
      APP_ORIGIN: https://localhost:8443
      DEMO_ENABLED: 'false'
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8080:80']
    volumes:
      - ./.local/tls:/run/tls:ro
      - ./web:/app/web:ro
      - ./backend:/app/backend:ro
    networks: [database, frontend]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
networks:
  database: {internal: true}
  frontend: {}
volumes:
  mysql-data:
